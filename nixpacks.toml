# Railway / Nixpacks build config for the Next.js app.
# Forces a Node.js toolchain (not Python) and the standard Next build/start flow.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
